spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id : user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**

        - id : product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**

        - id : order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
server:
  port: 8080

eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true