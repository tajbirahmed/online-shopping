spring:
  application:
    name: user-service
  config:
    import: classpath:secrets.yml
  datasource:
    url: ${secrets.datasource.url}
    username: ${secrets.datasource.username}
    password: ${secrets.datasource.password}
# jwt
server:
  port: 8081
eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
